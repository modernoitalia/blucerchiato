<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casanova Blucerchiata – Sampdoria Club Val Trebbia</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f4f7fc;--card:rgba(255,255,255,.94);--ov:rgba(255,255,255,.12);--tx:#10203f;--mu:#5b6b8a;--bl:#004191;--rd:#e1062c;--bd:#dbe2ef;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1224;--card:rgba(19,31,59,.93);--ov:rgba(4,10,24,.55);--tx:#eaf0ff;--mu:#9fb0d3;--bl:#3a74d6;--bd:#25365c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1224;--card:rgba(19,31,59,.93);--ov:rgba(4,10,24,.55);--tx:#eaf0ff;--mu:#9fb0d3;--bl:#3a74d6;--bd:#25365c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
nav button.on{background:var(--bl);color:var(--on);border-color:var(--bl)}
.hero{background:#fff;color:#10203f;border:1px solid var(--bd);border-radius:16px;overflow:hidden;text-align:center;margin-bottom:16px}
.band{height:10px;background:var(--bl)}
.hero .in{padding:24px 16px 28px}
.logo{display:block;width:min(240px,62vw);height:auto;margin:0 auto 14px}
.nlogo{height:34px;width:auto;margin-right:4px}
.hid{background:none;border:0;opacity:.3;cursor:pointer;font-size:.9rem;padding:4px 8px;color:var(--mu)}
.hid:hover{opacity:.8}
h1{margin-top:0}
h1{margin:0;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.1;color:#004191;text-transform:uppercase;letter-spacing:.02em}
.sub{margin:6px 0 20px;color:#10203f;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:1.15rem}
p{margin:.4em 0}
.mu{color:var(--mu);font-size:.92rem}
.btn,button.pri,label.pri{display:inline-block;background:var(--bl);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
form{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.6rem;color:var(--bl)}
.neg{color:var(--rd)}.pos{color:#17803d}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
li:last-child{border:0}
li .l{min-width:0}
.sm{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.pw{display:flex;gap:6px;margin-top:6px}.pw input{padding:6px 8px}
.tag{background:var(--bl);color:var(--on);border-radius:999px;padding:2px 10px;font-size:.8rem}
.err{color:var(--rd);font-size:.9rem}
footer{text-align:center;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;font-size:.85rem;padding:8px;margin-bottom:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ov),var(--ov)),url(sfondo.jpg) center/cover no-repeat}
.count{text-align:center}.count b{display:block;font-size:2.8rem;color:var(--bl);line-height:1.1}.count span{color:var(--mu)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=v=>v.toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const LOGO="logo.png";
const IG="https://www.instagram.com/casanovablucerchiata/";
let S=null,me=null,isAdmin=false,view="home",err="",pub=null,tok=null;
try{tok=sessionStorage.getItem("cbt");}catch(e){}

async function api(path,body){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||"Errore"),{status:r.status});
  return j;
}
function logout(){tok=null;S=null;me=null;isAdmin=false;try{sessionStorage.removeItem("cbt")}catch(e){}}
async function loadClub(){
  const j=await api("club");
  S=j.data;S.fees=S.fees||{};me=j.me||null;isAdmin=j.role==="admin";
}
async function save(){
  try{await api("admin/save",S);err="";await loadClub();}
  catch(e){if(e.status===401){logout();err="Sessione scaduta, rientra.";}else err=e.message;}
  render();
}
const feeOf=y=>S.fees[y]??S.fee;
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const pw=m=>norm(m.cognome)+m.n;
function parseYears(s){
  const out=new Set();
  String(s).split(/[,;]+/).forEach(t=>{
    t=t.trim().toLowerCase();if(!t)return;
    const m=t.match(/^(\d{4})\s*(?:-|–|a)\s*(\d{4}|in corso|oggi)$/);
    if(m){const a=+m[1],b=/^\d/.test(m[2])?+m[2]:S.year;for(let y=Math.min(a,b);y<=Math.max(a,b)&&y<=S.year+1;y++)out.add(y);}
    else if(/^\d{4}$/.test(t))out.add(+t);
  });
  return [...out].filter(y=>y>=1950).sort((a,b)=>a-b);
}
function fmtYears(a){
  if(!a.length)return "—";
  const r=[];let s=a[0],p=a[0];
  const push=()=>r.push(s===p?`${p}`:`${s}-${p===S.year?"in corso":p}`);
  for(let i=1;i<a.length;i++){if(a[i]===p+1)p=a[i];else{push();s=p=a[i];}}
  push();return r.join(", ");
}
const first=m=>m.anni.length?Math.min(...m.anni):"—";
function budget(){
  const ys={};S.members.forEach(m=>m.anni.forEach(y=>ys[y]=(ys[y]||0)+1));
  const rows=Object.keys(ys).sort((a,b)=>b-a).map(y=>({y:+y,n:ys[y],f:feeOf(y),v:ys[y]*feeOf(y)}));
  const inc=rows.reduce((t,r)=>t+r.v,0),extra=S.exp.reduce((t,e)=>t+e.amt,0);
  return {rows,inc,extra,tot:inc+extra};
}
const money=v=>`<span class="${v<0?"neg":"pos"}">${v>0?"+":""}${eur(v)}</span>`;
function dl(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function report(kind){
  const c=v=>v.toFixed(2).replace(".",","),b=budget();
  const rows=kind==="soci"
    ?[["Numero","Nome","Cognome","Anno di nascita","Email","Tessere","Prima tessera"],...S.members.map(m=>[m.n,m.nome,m.cognome,m.nascita||"",m.email||"",fmtYears(m.anni),first(m)])]
    :[["Voce","Importo"],...b.rows.map(r=>[`Tessera ${r.y} x${r.n}`,c(r.v)]),...S.exp.map(e=>[e.label,c(e.amt)]),["Totale rimanente",c(b.tot)]];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  dl(`report-${kind}-${S.year}.csv`,"\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),"text/csv");
}

function home(){return `
<section class="hero"><div class="band"></div><div class="in">
<img class="logo" src="${LOGO}" alt="Logo Casanova Blucerchiata"><h1>Casanova Blucerchiata</h1><div class="sub">Sampdoria Club Val Trebbia</div>
<a class="btn" href="${IG}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-4px;margin-right:8px"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@casanovablucerchiata</a></div></section>
${pub?`<section class="card count"><b>${pub.count}</b><span>Tesserati ${pub.year}</span></section>`:""}`}

function login(){return `
<section class="card"><h2>${view==="adm"?"Accesso admin":"Accesso area riservata"}</h2>
<form data-f="login"><input name="pw" type="password" placeholder="Password" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
<button class="pri">Entra</button><div class="err">${esc(err)}</div></form>
${view==="adm"?"":`<p class="mu">La password ti viene comunicata dal club.</p>`}</section>`}

function area(){
  const b=budget(),n=S.members.length;
  let h="";
  if(me)h+=`<section class="card"><h2>Profilo</h2><p><b>#${me.n}</b> ${esc(me.nome)} ${esc(me.cognome)}</p>
  <p class="mu">Tesserato dal ${first(me)}<br>Tessere: ${fmtYears(me.anni)}${me.nascita?`<br>Anno di nascita: ${me.nascita}`:""}</p></section>`;
  h+=`<div class="stats"><div class="stat"><span class="mu">Tesserati ${S.year}</span><b>${S.members.filter(m=>m.anni.includes(S.year)).length}</b></div>
  <div class="stat"><span class="mu">Budget del club</span><b class="${b.tot<0?"neg":""}">${eur(b.tot)}</b></div></div>`;
  if(isAdmin)h+=`<section class="card"><h2>Report e backup</h2><div class="row2">
  <button class="pri" data-a="rep" data-k="soci">Scarica tesserati</button><button class="pri" data-a="rep" data-k="budget">Scarica budget</button>
  <button class="pri" data-a="bak">Scarica backup</button><label class="pri" style="text-align:center">Ripristina backup<input id="rest" type="file" accept=".json" hidden></label></div>
  <div class="err">${esc(err)}</div></section>`;
  h+=`<section class="card"><h2>Budget</h2><ul>`;
  b.rows.forEach(r=>{h+=`<li><span class="l">Tessera ${r.y} x${r.n}<br><span class="mu">${eur(r.f)} ciascuna</span></span>${money(r.v)}</li>`});
  S.exp.forEach((e,i)=>{h+=`<li><span class="l">${esc(e.label)}</span><span>${money(e.amt)}${isAdmin?` <button class="sm" data-a="dele" data-i="${i}">✕</button>`:""}</span></li>`});
  h+=`<li><b>Totale rimanente</b><b>${money(b.tot)}</b></li></ul></section>`;
  if(isAdmin)h+=`<section class="card"><h2>Anno e quota tessera</h2>
  <form data-f="yr"><div class="row2"><input name="year" type="number" value="${S.year}" required><button class="pri">Imposta anno in corso</button></div></form>
  <form data-f="fee" style="margin-top:10px"><div class="row2"><input name="y" type="number" value="${S.year}" required><input name="f" inputmode="decimal" value="${feeOf(S.year)}" required></div>
  <button class="pri">Imposta quota (€) per l’anno scelto</button></form></section>
  <section class="card"><h2>Aggiungi spesa o entrata</h2>
  <form data-f="adde"><input name="label" placeholder="Descrizione (es. Pullman trasferta)" required>
  <input name="amt" inputmode="decimal" placeholder="Importo: negativo per le spese, es. -120" required>
  <button class="pri">Aggiungi</button></form></section>`;
  h+=`<section class="card"><h2>Tesserati</h2>`;
  h+=n?"<ul>":`<p class="mu">Nessun tesserato ancora.</p>`;
  [...S.members].sort((a,b)=>a.n-b.n).forEach(m=>{h+=`<li><span class="l"><b>#${m.n}</b> ${esc(m.nome)} ${esc(m.cognome)}<br><span class="mu">Tessere: ${fmtYears(m.anni)}${isAdmin?`<br>Nato nel ${m.nascita||"—"}${m.email?` · ${esc(m.email)}`:""} · password: ${esc(pw(m))}`:""}</span>${isAdmin?`<div class="pw"><input id="y${m.n}" value="${fmtYears(m.anni)}"><button class="sm" data-a="sety" data-n="${m.n}">Salva anni</button><button class="sm" data-a="addy" data-n="${m.n}">+${S.year}</button></div>`:""}</span>${isAdmin?`<button class="sm" data-a="delm" data-n="${m.n}">Rimuovi</button>`:""}</li>`});
  if(n)h+="</ul>";
  h+="</section>";
  if(isAdmin)h+=`<section class="card"><h2>Nuovo tesserato</h2>
  <p class="mu">Password del tesserato: COGNOME + numero tessera (es. ROSSI12)</p>
  <form data-f="addm"><input name="n" type="number" min="1" placeholder="Numero tessera" required>
  <div class="row2"><input name="nome" placeholder="Nome" required><input name="cognome" placeholder="Cognome" required></div>
  <input name="nascita" type="number" min="1900" max="${new Date().getFullYear()}" placeholder="Anno di nascita (obbligatorio)" required>
  <input name="anni" value="${S.year}" placeholder="Anni di tessera, es. 2021-2022, 2024-in corso" required>
  <input name="email" type="email" placeholder="Email (facoltativa)">
  <button class="pri">Aggiungi tesserato</button><div class="err">${esc(err)}</div></form></section>`;
  return h;
}

function render(){
  const inArea=S&&(view==="adm"?isAdmin:(me||isAdmin));
  $("#root").innerHTML=`<div class="wrap" style="padding:0"><nav><img class="nlogo" src="${LOGO}" alt="">
  <button class="${view==="home"?"on":""}" data-a="nav" data-v="home">Home</button>
  <button class="${view==="soci"?"on":""}" data-a="nav" data-v="soci">Area riservata</button>
  ${isAdmin?`<span class="tag">Admin</span>`:""}${S?`<button data-a="out">Esci</button>`:""}</nav>
  <main>${view==="home"?home():(inArea?area():login())}</main>
  <footer>Casanova Blucerchiata · Sampdoria Club Val Trebbia <button class="hid" data-a="nav" data-v="adm" aria-label="Accesso admin">🔒</button></footer></div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="nav"){view=t.dataset.v;err="";render();}
  else if(a==="out"){logout();view="home";err="";render();}
  else if(!isAdmin)return;
  else if(a==="rep")report(t.dataset.k);
  else if(a==="bak")dl(`backup-casanova-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1),"application/json");
  else if(a==="dele"){S.exp.splice(+t.dataset.i,1);save();}
  else if(a==="delm"){S.members=S.members.filter(m=>m.n!==+t.dataset.n);save();}
  else if(a==="sety"){const m=S.members.find(x=>x.n===+t.dataset.n);m.anni=parseYears($("#y"+m.n).value);save();}
  else if(a==="addy"){const m=S.members.find(x=>x.n===+t.dataset.n);m.anni=[...new Set([...m.anni,S.year])].sort();save();}
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="rest"||!isAdmin)return;
  try{const t=await e.target.files[0].text();S=JSON.parse(t);await save();}
  catch(x){err="File di backup non valido.";await loadClub().catch(()=>{});render();}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f));
  if(k==="login"){
    try{
      const j=await api("login",{password:d.pw});
      tok=j.token;try{sessionStorage.setItem("cbt",tok)}catch(x){}
      await loadClub();err="";
    }catch(x){err=x.message;}
    render();
  }else if(!isAdmin)return;
  else if(k==="adde"){
    const v=parseFloat(String(d.amt).replace(",","."));
    if(isNaN(v)){err="Importo non valido.";render();return;}
    S.exp.push({label:d.label.trim(),amt:v});save();
  }else if(k==="yr"){S.year=+d.year;save();}
  else if(k==="fee"){
    const v=parseFloat(String(d.f).replace(",","."));
    if(isNaN(v)||v<0){err="Quota non valida.";render();return;}
    S.fees[+d.y]=v;save();
  }else if(k==="addm"){
    const n=+d.n,anni=parseYears(d.anni);
    if(S.members.some(m=>m.n===n)){err="Numero tessera già assegnato.";render();return;}
    if(!anni.length){err="Anni di tessera non validi.";render();return;}
    S.members.push({n,nome:d.nome.trim(),cognome:d.cognome.trim(),nascita:+d.nascita,email:(d.email||"").trim().toLowerCase(),anni});err="";save();
  }
});

render();
api("public").then(j=>{pub=j;render();}).catch(()=>{});
if(tok)loadClub().then(()=>{view=isAdmin?"adm":"soci";render();}).catch(()=>{logout();render();});
</script>
</body>
</html>
